name: Ruff

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff==0.2.2 black==24.2.0
    - name: Analyzing the code with ruff
      run: |
        ruff $(git ls-files '*.py')
    - name: Verify that no Black changes are required
      run: |
        black --check $(git ls-files '*.py')
    - name: Run fast tests
      run: |
        pip install -e .[test]
        pytest -m "not slow"
    - name: Video pipeline tests
      working-directory: video-pipeline
      run: |
        pip install rich pillow numpy requests soundfile
        pytest tests -q
    - name: Cinematic engine provider check
      working-directory: cinematic-pipeline/engine/tests
      run: |
        python test_http_provider.py
    - name: Studio job history tests
      working-directory: cinematic-pipeline/studio
      run: |
        pytest tests -q
